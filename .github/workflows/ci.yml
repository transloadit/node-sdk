# Temporary diagnostic branch only. Never merge this workflow replacement.
name: SDK Edge crash diagnosis

on:
  push:
    branches: [edge-crash]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.ref == 'refs/heads/edge-crash'
    name: Native x64 probe ${{ matrix.sample }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: corepack yarn install --immutable
      - run: node scripts/diagnose-sdk-edge.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sdk-edge-diagnosis-${{ matrix.sample }}
          path: test-results/sdk-edge-diagnosis
          retention-days: 7
          if-no-files-found: error
